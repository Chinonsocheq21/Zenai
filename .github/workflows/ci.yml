name: CI
on:
  pull_request:
  push: {branches: [main]}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff pytest fastapi httpx pydantic-settings segno scikit-learn joblib "psycopg[binary]" pgserver
      - run: ruff check src training tests
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # playwright.config.ts uses channel "chrome"; ubuntu runners ship google-chrome.
      - name: Ensure Chrome
        run: command -v google-chrome || npx playwright install --with-deps chrome
      # crisis.spec.ts targets production and runs in the uptime workflow, not here.
      - run: npx playwright test site.spec.ts
