name: Uptime and crisis check
# Every 30 minutes: the live site answers, the models load, a reply comes back,
# and a synthetic crisis message still gets the hand-off. A failed run emails the
# repository owner (GitHub's default for failed scheduled workflows).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/smoke.py https://zenai-app.vercel.app
        env:
          SMOKE_INVITE: ${{ secrets.SMOKE_INVITE }}   # signs the check in so it can test a real reply
