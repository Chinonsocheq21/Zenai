<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try ZenAI · scan the code</title>
<style>
  :root{--ink:#0E1A33;--orange:#E8742E;--sky:#7FA6E0;--sans:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--serif:"New York","Iowan Old Style",Georgia,serif;--mono:"SF Mono",Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;
    background:radial-gradient(1500px 700px at 50% 118%, rgba(232,116,46,.55), rgba(46,98,176,.28) 45%, transparent 75%),
               radial-gradient(900px 500px at 50% -10%, rgba(46,98,176,.18), transparent 70%), #070B16}
  .wrap{height:100%;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:6vw;padding:0 7vw}
  .orb{width:84px;height:84px;border-radius:50%;margin-bottom:34px;background:radial-gradient(circle at 34% 28%,#FFE3CC,#F2A26B 26%,#E8742E 46%,#8E6C8E 72%,#1B3D6F);
       box-shadow:0 0 80px rgba(232,116,46,.5);animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.07);border-radius:46% 54% 52% 48%/50% 46% 54% 50%}}
  h1{font-weight:300;font-size:clamp(48px,5.4vw,96px);letter-spacing:-.03em;line-height:1.05}
  h1 b{font-weight:300;background:linear-gradient(90deg,#F6B48A,#E8742E);-webkit-background-clip:text;color:transparent}
  .sub{font-size:clamp(18px,1.6vw,28px);color:rgba(255,255,255,.7);margin-top:22px;line-height:1.5;max-width:640px}
  .code{margin-top:38px;display:inline-flex;align-items:center;gap:18px;padding:16px 26px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
  .code span{font-family:var(--mono);font-size:15px;letter-spacing:.18em;color:rgba(255,255,255,.55)}
  .code b{font-family:var(--mono);font-size:clamp(28px,2.6vw,44px);letter-spacing:.12em}
  .card{justify-self:center;background:#fff;border-radius:34px;padding:34px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 40px 120px rgba(0,0,0,.5), 0 0 80px rgba(232,116,46,.25);text-align:center}
  .card img{width:min(34vw,56vh);height:min(34vw,56vh);display:block}
  .url{margin-top:18px;font-family:var(--mono);font-size:clamp(14px,1.2vw,20px);color:var(--ink)}
  .foot{position:fixed;left:7vw;right:7vw;bottom:28px;display:flex;justify-content:space-between;font-size:15px;color:rgba(255,255,255,.5)}
  .foot a{color:rgba(255,255,255,.7)}
  .warn{color:#F6B48A}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="orb"></div>
    <h1>Scan to try <b>ZenAI</b>.</h1>
    <p class="sub">Point your phone's camera at the code. Same Wi-Fi as this laptop. Nothing you type is kept, and nothing is shared with the university.</p>
    <div class="code" id="codeBox" hidden><span>CLASS CODE</span><b id="code"></b></div>
  </div>
  <div class="card"><img id="qr" alt="QR code for the ZenAI student app"><div class="url" id="url"></div></div>
</div>
<div class="foot"><span>ZenAI is not a counselor. In crisis, call or text 988.</span><span id="hint"></span><a href="/workflow/" target="_blank">Watch replies go through the pipeline →</a></div>
<script>
fetch("/present/info").then(r => r.json()).then(d => {
  document.getElementById("qr").src = "/qr.svg?data=" + encodeURIComponent(d.url);
  document.getElementById("url").textContent = d.url.replace(/^https?:\/\//, "");
  if (d.code) { document.getElementById("code").textContent = d.code; document.getElementById("codeBox").hidden = false; }
  if (!d.public_url) document.getElementById("hint").innerHTML = '<span class="warn">Local Wi-Fi mode: voice needs the hosted https address</span>';
});
</script>
</body>
</html>
