[project]
name = "zenai"
version = "0.1.0"
description = "An AI counselor that stays inside the protocol. COSC 490 Project 5, Group 3."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32",
  "pydantic>=2.9", "pydantic-settings>=2.6",
  "sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2", "pgvector>=0.3",
  "redis>=5.2",
  "transformers>=4.46", "torch>=2.2", "accelerate>=0.26",
  "scikit-learn>=1.5", "pandas>=2.2",
  # numpy MUST stay on 1.x: the torch wheels that still support Python 3.9 were
  # built against the 1.x C API, and numpy 2 makes every tensor->array call fail
  # with "Failed to initialize NumPy: _ARRAY_API not found" -- which surfaces as
  # a silent exit, not an error. Drop this pin only when the project moves to 3.11.
  "numpy<2",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "jupyter>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py311"
# src/ layout: say where first-party code lives, or CI and a local venv
# classify `zenai` differently and sort imports in opposite orders.
src = [".", "src"]

[tool.ruff.lint.isort]
known-first-party = ["zenai", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
