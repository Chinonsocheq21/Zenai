services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zenai
      POSTGRES_PASSWORD: zenai
      POSTGRES_DB: zenai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, retries: 10}

  api:
    build: .
    command: uvicorn zenai.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://zenai:zenai@postgres:5432/zenai
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["./src:/app/src", "./data:/app/data", "./models:/app/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
